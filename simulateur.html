      <div class="sim glass" id="sim">
        <div class="sim-in">
          <h3 class="sr-only">Vos options</h3>
          <fieldset class="seg" aria-label="Votre besoin">
            <label><input type="radio" name="sim-type" value="refonte"><span>Refonte</span></label>
            <label><input type="radio" name="sim-type" value="creation" checked><span>Création</span></label>
            <label><input type="radio" name="sim-type" value="premium"><span>Premium</span></label>
            <label><input type="radio" name="sim-type" value="boutique"><span>Boutique</span></label>
          </fieldset>
          <div class="sim-bq" hidden>
            <div class="opt step"><span class="ot">Nombre de produits<small>20 inclus, puis 80 € par lot de 20</small></span>
              <span class="stp"><button type="button" data-np="-1" aria-label="Moins de produits">−</button><output id="sim-np">20</output><button type="button" data-np="1" aria-label="Plus de produits">+</button></span></div>
            <label class="opt"><input type="checkbox" name="sim-promo"><span class="sw" aria-hidden="true"></span><span class="ot">Codes promo et livraison offerte<small>100 €</small></span></label>
          </div>
          <details class="sim-plus"><summary>Fonctionnalités en plus</summary><div>
            <div class="opt step"><span class="ot">Pages en plus<small>60 € la page, au-delà de celles de la formule</small></span>
              <span class="stp"><button type="button" data-pp="-1" aria-label="Moins de pages">−</button><output id="sim-pp">0</output><button type="button" data-pp="1" aria-label="Plus de pages">+</button></span></div>
            <label class="opt"><input type="checkbox" name="sim-gal"><span class="sw" aria-hidden="true"></span><span class="ot">Galerie photo<small>Vos réalisations en grand, 60 €</small></span></label>
            <label class="opt"><input type="checkbox" name="sim-blog"><span class="sw" aria-hidden="true"></span><span class="ot">Blog ou actualités<small>Que vous publiez vous-même, 150 €</small></span></label>
            <label class="opt"><input type="checkbox" name="sim-resa"><span class="sw" aria-hidden="true"></span><span class="ot">Réservation en ligne<small>Vos clients choisissent un créneau, 150 €</small></span></label>
            <label class="opt"><input type="checkbox" name="sim-espace"><span class="sw" aria-hidden="true"></span><span class="ot">Espace client<small>Sur devis</small></span></label>
            <label class="opt"><input type="checkbox" name="sim-mesure"><span class="sw" aria-hidden="true"></span><span class="ot">Fonctionnalité sur mesure<small>Calculateur, carte, outil métier… sur devis</small></span></label>
          </div></details>
          <label class="opt"><input type="checkbox" name="sim-google"><span class="sw" aria-hidden="true"></span><span class="ot">Fiche Google Maps<small>Pour apparaître sur la carte, 80 €</small></span></label>
          <label class="opt"><input type="checkbox" name="sim-dom" checked><span class="sw" aria-hidden="true"></span><span class="ot">Nom de domaine à votre nom<small>Environ 15 € par an</small></span></label>
          <label class="opt"><input type="checkbox" name="sim-maint"><span class="sw" aria-hidden="true"></span><span class="ot">Maintenance<small id="sim-maint-t">Site suivi et 1 h de modifs par mois, 40 €/mois</small></span></label>
          <fieldset class="seg" aria-label="Paiement">
            <label><input type="radio" name="sim-pay" value="2" checked><span>En 2 fois</span></label>
            <label><input type="radio" name="sim-pay" value="3"><span>En 3 fois</span></label>
          </fieldset>
        </div>
        <div class="sim-out" aria-live="polite">
          <small>Votre site</small>
          <div class="sim-total"><span id="sim-total">750</span> €</div>
          <p class="sim-sd" id="sim-sd"></p>
          <ul class="sim-recap" id="sim-recap"></ul>
          <ul id="sim-steps"></ul>
          <p id="sim-rec"></p>
          <button class="btn btn-lg btn-primary" id="sim-go">Demander ce devis</button>
          <p class="sim-warn">Estimation indicative aux tarifs de lancement, pas un devis. Le prix final est confirmé par un devis gratuit.</p>
        </div>
      </div>
