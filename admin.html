<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<title>Studio Mel · Gestion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F5BFF'/%3E%3Cpath d='M17 46V19h6l9 13 9-13h6v27h-7V31l-8 11-8-11v15z' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin/erp.css">
</head>
<body>

<section id="login" class="hide">
  <div class="box">
    <div class="logo"><b>M</b>Studio <span>Mel</span></div>
    <p>Espace réservé. Connecte-toi pour gérer ton activité.</p>
    <input id="lmail" type="email" value="studio-mel@outlook.fr" autocomplete="username" aria-label="E-mail">
    <input id="lpass" type="password" placeholder="Mot de passe" autocomplete="current-password" aria-label="Mot de passe">
    <button class="pri" id="lbtn">Se connecter</button>
    <div class="err" id="lerr"></div>
  </div>
</section>

<section id="app" class="hide">
  <aside class="side" id="side" aria-label="Navigation">
    <div class="side-top">
      <div class="logo"><b>M</b><span class="lt">Studio <span>Mel</span></span></div>
      <button class="side-fold" id="fold" aria-label="Réduire le menu" title="Réduire le menu"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
    </div>
    <nav class="tabs">
      <p class="grp">Pilotage</p>
      <button id="tabH" class="on" title="Tableau de bord"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span>Tableau de bord</span></button>
      <button id="tabL" title="Planning"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18M8 14h2M14 14h2M8 17h2"/></svg><span>Planning</span><em class="nb" id="nbL"></em></button>
      <p class="grp">Commercial</p>
      <button id="tabP" title="Prospects"><svg viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg><span>Prospects</span><em class="nb" id="nbP"></em></button>
      <button id="tabD" title="Demandes et devis"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span>Demandes et devis</span><em class="nb" id="nbD"></em></button>
      <button id="tabR" title="Rendez-vous"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Rendez-vous</span><em class="nb" id="nbR"></em></button>
      <button id="tabC" title="Clients"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg><span>Clients</span></button>
      <p class="grp">Production</p>
      <button id="tabJ" title="Projets"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M8 14l2.5 2.5L16 11"/></svg><span>Projets</span><em class="nb ko" id="nbJ"></em></button>
      <p class="grp">Gestion</p>
      <button id="tabF" title="Factures"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg><span>Factures</span><em class="nb ko" id="nbF"></em></button>
      <button id="tabX" title="Dépenses"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="13" rx="2"/><path d="M2.5 10h19M6 15h3"/></svg><span>Dépenses</span></button>
      <button id="tabO" title="Documents"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Documents</span></button>
    </nav>
    <div class="side-foot">
      <div class="me"><b>M</b><span><strong>Melvyn</strong><small id="meMail">studio-mel@outlook.fr</small></span></div>
      <button id="logout" title="Déconnexion"><svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg><span>Déconnexion</span></button>
    </div>
  </aside>
  <div class="veil" id="veil"></div>

  <div class="mainc">
    <header class="top">
      <button class="burger" id="burger" aria-label="Ouvrir le menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
      <div class="ttl"><small id="crumb">Pilotage</small><h1 id="pageTitle">Tableau de bord</h1></div>
      <div class="acts">
        <button class="pri" id="newDevis"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Devis</span></button>
        <button id="newFacture"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Facture</span></button>
      </div>
    </header>
    <main>
      <div id="list">
        <div class="stats" id="stats"></div>
        <div id="items"></div>
      </div>
      <div id="editor" class="hide"></div>
    </main>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script type="module" src="admin/app.js"></script>
</body>
</html>
